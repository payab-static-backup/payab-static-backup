      - name: Create scraper script
        run: |
          cat > scrape.js << 'SCRIPT'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const http = require('http');
          const { URL } = require('url');

          const OUTPUT = process.env.OUTPUT || 'backup';
          const CHUNK = process.env.CHUNK || '0';
          const MAX_RETRIES = parseInt(process.env.MAX_RETRIES || '3');

          const urlFile = `chunk-0${CHUNK}.txt`;
          const urls = fs.readFileSync(urlFile, 'utf8')
            .split('\n')
            .map(u => u.trim())
            .filter(u => u && u.startsWith('http'));

          console.log(`Chunk ${CHUNK}: ${urls.length} URLs`);

          const downloadedAssets = new Set();
          const failedAssets = [];

          function ensureDir(dir) {
            fs.mkdirSync(dir, { recursive: true });
          }

          // مسیر محلی بدون query string
          function urlToLocalPath(assetUrl) {
            try {
              const u = new URL(assetUrl);
              let p = u.pathname;
              if (p.endsWith('/')) p += 'index.html';
              return path.join(OUTPUT, p.replace(/^\//, ''));
            } catch {
              return null;
            }
          }

          async function downloadAsset(assetUrl, retries = MAX_RETRIES) {
            // حذف query برای جلوگیری از دانلود تکراری
            const cleanUrl = assetUrl.split('?')[0];
            if (downloadedAssets.has(cleanUrl)) return;
            downloadedAssets.add(cleanUrl);

            const localPath = urlToLocalPath(cleanUrl);
            if (!localPath) return;

            // فقط دامنه اصلی + CDNهای مجاز
            if (!cleanUrl.includes('payab.ir') &&
                !cleanUrl.includes('googleapis.com') &&
                !cleanUrl.includes('gstatic.com') &&
                !cleanUrl.includes('cloudflare') &&
                !cleanUrl.includes('jsdelivr') &&
                !cleanUrl.includes('fontawesome') &&
                !cleanUrl.includes('bootstrapcdn')) {
              return;
            }

            ensureDir(path.dirname(localPath));

            // اگر قبلاً فایل وجود دارد، رد شو
            if (fs.existsSync(localPath) && fs.statSync(localPath).size > 0) {
              return;
            }

            for (let i = 0; i < retries; i++) {
              try {
                const protocol = cleanUrl.startsWith('https') ? https : http;
                await new Promise((resolve, reject) => {
                  const req = protocol.get(cleanUrl, { timeout: 25000 }, (res) => {
                    if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                      downloadAsset(res.headers.location, retries).then(resolve).catch(reject);
                      return;
                    }
                    if (res.statusCode !== 200) {
                      reject(new Error(`HTTP ${res.statusCode}`));
                      return;
                    }
                    const file = fs.createWriteStream(localPath);
                    res.pipe(file);
                    file.on('finish', () => {
                      file.close();
                      resolve();
                    });
                  });
                  req.on('error', reject);
                  req.on('timeout', () => {
                    req.destroy();
                    reject(new Error('Timeout'));
                  });
                });
                console.log(`  ✓ Asset: ${cleanUrl}`);
                return;
              } catch (err) {
                if (i === retries - 1) {
                  console.log(`  ✗ Failed: ${cleanUrl} → ${err.message}`);
                  failedAssets.push(cleanUrl);
                } else {
                  await new Promise(r => setTimeout(r, 1200 * (i + 1)));
                }
              }
            }
          }

          // لیست فایل‌های حیاتی که حتماً باید دانلود شوند
          const criticalAssets = [
            'https://payab.ir/wp-content/plugins/elementor/assets/css/frontend.css',
            'https://payab.ir/wp-content/plugins/elementor/assets/css/frontend.min.css',
            'https://payab.ir/wp-content/plugins/elementor/assets/css/frontend-rtl.css',
            'https://payab.ir/wp-content/plugins/elementor/assets/css/frontend-rtl.min.css',
            'https://payab.ir/wp-content/plugins/elementor/assets/css/widget-image-rtl.min.css',
            'https://payab.ir/wp-content/plugins/elementor/assets/css/widget-nav-menu-rtl.min.css',
            'https://payab.ir/wp-content/plugins/elementor/assets/css/widget-divider-rtl.min.css',
            'https://payab.ir/wp-content/plugins/elementor/assets/css/widget-heading-rtl.min.css',
            'https://payab.ir/wp-content/plugins/elementor/assets/css/widget-accordion-rtl.min.css',
            'https://payab.ir/wp-content/plugins/elementor/assets/css/widget-icon-list-rtl.min.css',
            'https://payab.ir/wp-includes/js/jquery/jquery.min.js',
            'https://payab.ir/wp-includes/js/jquery/jquery.js',
          ];

          (async () => {
            // اول فایل‌های حیاتی را دانلود کن
            console.log('Downloading critical assets first...');
            for (const asset of criticalAssets) {
              await downloadAsset(asset);
            }

            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              viewport: { width: 1920, height: 1080 },
              locale: 'fa-IR'
            });

            // جمع‌آوری assetها از شبکه
            context.on('response', async (response) => {
              try {
                const url = response.url();
                const ct = (response.headers()['content-type'] || '').toLowerCase();
                if (
                  response.ok() &&
                  (ct.includes('css') ||
                   ct.includes('javascript') ||
                   ct.includes('font') ||
                   ct.includes('image') ||
                   url.match(/\.(css|js|woff2?|ttf|eot|jpg|jpeg|png|gif|webp|svg|ico)(\?|$)/i))
                ) {
                  await downloadAsset(url);
                }
              } catch {}
            });

            for (const pageUrl of urls) {
              console.log(`\n========== Rendering: ${pageUrl} ==========`);
              let success = false;

              for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
                try {
                  const page = await context.newPage();

                  await page.goto(pageUrl, {
                    waitUntil: 'networkidle',
                    timeout: 60000
                  });

                  // صبر برای اجرای کامل Elementor
                  await page.waitForTimeout(5000);

                  // اسکرول برای لود lazy-load
                  await page.evaluate(async () => {
                    await new Promise(resolve => {
                      let total = 0;
                      const dist = 500;
                      const timer = setInterval(() => {
                        window.scrollBy(0, dist);
                        total += dist;
                        if (total >= document.body.scrollHeight) {
                          clearInterval(timer);
                          window.scrollTo(0, 0);
                          resolve();
                        }
                      }, 150);
                    });
                  });

                  await page.waitForTimeout(2500);

                  let html = await page.content();

                  // ===== مهم‌ترین بخش: پاکسازی لینک‌ها =====
                  // 1. حذف دامنه
                  html = html
                    .replace(/https?:\/\/payab\.ir\//g, '/')
                    .replace(/https?:\/\/www\.payab\.ir\//g, '/');

                  // 2. حذف تمام query string از فایل‌های استاتیک (css, js, font, image)
                  html = html.replace(
                    /(\/(?:wp-content|wp-includes)\/[^"'?\s]+?\.(?:css|js|woff2?|ttf|eot|jpg|jpeg|png|gif|webp|svg|ico))\?[^"'>\s]*/gi,
                    '$1'
                  );

                  // 3. حالت‌های دیگر query string
                  html = html.replace(
                    /(src|href)=["']([^"']+\.(?:css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|svg|ico))\?[^"']*["']/gi,
                    '$1="$2"'
                  );

                  const u = new URL(pageUrl);
                  let localPath = path.join(OUTPUT, u.pathname.replace(/^\//, ''));
                  if (localPath.endsWith('/') || !path.extname(localPath)) {
                    localPath = path.join(localPath, 'index.html');
                  } else if (!localPath.endsWith('.html')) {
                    localPath += '.html';
                  }

                  ensureDir(path.dirname(localPath));
                  fs.writeFileSync(localPath, html, 'utf8');
                  console.log(`  ✓ Saved HTML → ${localPath}`);

                  await page.close();
                  success = true;
                  break;
                } catch (err) {
                  console.log(`  ✗ Attempt ${attempt}/${MAX_RETRIES}: ${err.message}`);
                  if (attempt < MAX_RETRIES) {
                    await new Promise(r => setTimeout(r, 2000 * attempt));
                  }
                }
              }

              if (!success) {
                console.log(`  !! Giving up on ${pageUrl}`);
              }
            }

            await browser.close();

            console.log('\n========== CHUNK SUMMARY ==========');
            console.log(`Downloaded assets: ${downloadedAssets.size}`);
            console.log(`Failed assets: ${failedAssets.length}`);
            if (failedAssets.length) {
              failedAssets.forEach(f => console.log('  - ' + f));
            }
            fs.writeFileSync(`failed-assets-${CHUNK}.txt`, failedAssets.join('\n'));
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          SCRIPT
