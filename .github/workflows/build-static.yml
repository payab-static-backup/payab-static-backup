name: Fast Static Backup (Test)

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet parallel wget

      - name: Clean backup
        run: |
          rm -rf backup
          mkdir -p backup

      - name: Get first 10 sitemap URLs
        run: |
          curl -fsSL https://payab.ir/page-sitemap.xml \
            | xmlstarlet sel \
                -N x="http://www.sitemaps.org/schemas/sitemap/0.9" \
                -t -m "//x:loc" -v . -n \
            | head -10 > urls.txt

          echo "https://payab.ir/" >> urls.txt
          sort -u urls.txt -o urls.txt

          cat urls.txt

      - name: Download in parallel
        run: |
          cat urls.txt | parallel -j4 '
            wget \
              --page-requisites \
              --convert-links \
              --adjust-extension \
              --no-parent \
              --directory-prefix=backup \
              "{}" || true
          '

      - name: Show result
        run: |
          find backup | head -200

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

          git add backup

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Fast static backup test"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD
