name: Test Static Backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install HTTrack
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack

      - name: Clean backup
        run: |
          rm -rf backup
          mkdir backup

      - name: Mirror only homepage
        run: |
          httrack "https://payab.ir/" \
            -O backup \
            "+https://payab.ir/*" \
            "-*" \
            --depth=1 \
            --robots=0 \
            --keep-alive

      - name: Remove HTTrack cache
        run: |
          rm -rf backup/hts-cache
          find backup -name "*.tmp" -delete

      - name: Move site to backup root
        run: |
          if [ -d backup/payab.ir ]; then
            cp -r backup/payab.ir/* backup/
            rm -rf backup/payab.ir
          fi

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

          git add backup

          if ! git diff --cached --quiet; then
            git commit -m "Test homepage backup"
            git push
          fi
