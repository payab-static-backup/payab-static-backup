name: Build Static Backup
on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install xmlstarlet
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Extract URLs
        run: |
          echo "https://payab.ir/" > all-urls.txt
          curl -s --max-time 20 -A "Mozilla/5.0" "https://payab.ir/page-sitemap.xml" \
            | xmlstarlet sel -N x="http://www.sitemaps.org/schemas/sitemap/0.9" -t -v "//x:loc" -n \
            >> all-urls.txt || echo "Warning: failed to fetch sitemap"
          
          # حذف خطوط خالی و تکراری
          sort -u all-urls.txt | grep -v '^$' > urls.txt
          echo "Total URLs: $(wc -l < urls.txt)"
          cat urls.txt

      - name: Check if origin site is reachable
        id: check_site
        run: |
          if curl -sSf --max-time 15 -o /dev/null "https://payab.ir/"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all pages
        if: steps.check_site.outputs.reachable == 'true'
        run: |
          mkdir -p backup
          wget --page-requisites \
               --adjust-extension \
               --convert-links \
               --no-parent \
               --wait=1 --random-wait \
               --tries=2 \
               --dns-timeout=15 --connect-timeout=15 --read-timeout=20 \
               --reject-regex="-(300x[0-9]+|768x[0-9]+|1024x[0-9]+|1536x[0-9]+|2048x[0-9]+)\.(webp|jpg|jpeg|png)$" \
               --user-agent="Mozilla/5.0 (StaticBackupBot)" \
               --directory-prefix=backup \
               --input-file=urls.txt || true

      - name: Fix invalid filenames and references
        if: steps.check_site.outputs.reachable == 'true'
        run: |
          python3 << 'PYEOF'
          import os, re, urllib.parse
          backup_dir = "backup"
          invalid_chars = re.compile(r'[?:<>|*"]')
          renames = []
          for root, dirs, files in os.walk(backup_dir):
              for fname in files:
                  if invalid_chars.search(fname):
                      new_name = invalid_chars.sub('_', fname)
                      old_path = os.path.join(root, fname)
                      new_path = os.path.join(root, new_name)
                      renames.append((fname, new_name, old_path, new_path))
          print(f"Found {len(renames)} files to rename")
          
          text_files = []
          for root, dirs, files in os.walk(backup_dir):
              for fname in files:
                  if fname.lower().endswith(('.html', '.css', '.js')):
                      text_files.append(os.path.join(root, fname))
          
          for old_name, new_name, old_path, new_path in renames:
              old_name_encoded = urllib.parse.quote(old_name, safe='')
              new_name_encoded = urllib.parse.quote(new_name, safe='')
              for tf in text_files:
                  try:
                      with open(tf, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      changed = False
                      if old_name in content:
                          content = content.replace(old_name, new_name)
                          changed = True
                      if old_name_encoded in content:
                          content = content.replace(old_name_encoded, new_name_encoded)
                          changed = True
                      if changed:
                          with open(tf, 'w', encoding='utf-8') as f:
                              f.write(content)
                  except Exception:
                      pass
          
          for old_name, new_name, old_path, new_path in renames:
              if os.path.exists(old_path):
                  os.rename(old_path, new_path)
          print("Done renaming and updating references")
          PYEOF

      - name: Verify backup
        run: |
          echo "=== Structure ==="
          find backup -type f | head -30
          echo ""
          echo "=== HTML files count ==="
          find backup -name "*.html" | wc -l

      - name: Commit and push (TEST)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backup
          git diff --quiet && git diff --staged --quiet || git commit -m "TEST: single-job backup - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
