name: Build Static Backup

on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clean old output
        run: rm -rf output && mkdir -p output

      - name: Mirror the WordPress site
        run: |
          wget \
            --mirror \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --no-parent \
            --wait=1 \
            --random-wait \
            --tries=3 \
            --timeout=30 \
            --user-agent="Mozilla/5.0 (StaticBackupBot)" \
            --directory-prefix=output \
            https://payab.ir/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --quiet && git diff --staged --quiet || git commit -m "Static backup update - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
