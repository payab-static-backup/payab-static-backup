name: Build Static Backup

on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE: https://payab.ir
  OUTPUT: backup
  MAX_RETRIES: 2

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Collect URLs from all sitemaps
        id: split
        shell: bash
        run: |
          rm -f all-urls.txt
          echo "${SITE}/" > all-urls.txt

          SITEMAPS=(
            "page-sitemap.xml"
            "post-sitemap.xml"
            "ads-sitemap.xml"
            "ads-sitemap2.xml"
            "post_tag-sitemap.xml"
            "ad_cat-sitemap.xml"
            "building-news-sitemap.xml"
            "moghararat-sitemap.xml"
          )

          for sm in "${SITEMAPS[@]}"; do
            echo "Reading ${SITE}/${sm} ..."
            curl -L -s --retry 3 --retry-delay 2 "${SITE}/${sm}" \
              | xmlstarlet sel \
                  -N x="http://www.sitemaps.org/schemas/sitemap/0.9" \
                  -t -v "//x:loc" -n \
              >> all-urls.txt || true
          done

          grep -E '^https?://payab\.ir(/.*)?$' all-urls.txt \
            | grep -v -E '\.(jpg|jpeg|png|gif|webp|svg|css|js|woff|woff2|ttf|ico|pdf)(\?|$)' \
            | sort -u > clean-urls.txt
          mv clean-urls.txt all-urls.txt

          echo "Total unique URLs: $(wc -l < all-urls.txt)"
          head -40 all-urls.txt

          TOTAL=$(wc -l < all-urls.txt)
          if [ "$TOTAL" -le 3 ]; then
            cp all-urls.txt chunk-00.txt
            echo 'chunks=["0"]' >> "$GITHUB_OUTPUT"
          else
            split -n l/3 -d all-urls.txt chunk-
            for f in chunk-*; do mv "$f" "$f.txt"; done
            echo 'chunks=["0","1","2"]' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload chunks
        uses: actions/upload-artifact@v4
        with:
          name: url-chunks
          path: chunk-*.txt
          retention-days: 1

  download:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: url-chunks

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create scraper
        run: |
          cat > scrape.js << 'ENDOFSCRIPT'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const http = require('http');
          const { URL } = require('url');

          const OUTPUT = process.env.OUTPUT || 'backup';
          const CHUNK = process.env.CHUNK || '0';
          const MAX_RETRIES = parseInt(process.env.MAX_RETRIES || '2');
          const DELAY_BETWEEN_PAGES = 3000;
          const DELAY_BETWEEN_ASSETS = 350;

          const urlFile = `chunk-0${CHUNK}.txt`;
          const urls = fs.readFileSync(urlFile, 'utf8')
            .split('\n').map(u => u.trim()).filter(u => u.startsWith('http'));

          console.log(`Chunk ${CHUNK}: ${urls.length} URLs`);

          const downloaded = new Set();
          const failed = [];

          function ensureDir(d) { fs.mkdirSync(d, { recursive: true }); }
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function makeLocalPath(inputUrl, isAsset = false) {
            try {
              const clean = inputUrl.split('?')[0];
              const u = new URL(clean);
              let p = u.pathname;
              try { p = decodeURIComponent(p); } catch {}
              p = p.replace(/^\//, '');

              if (isAsset) {
                if (!p || p.endsWith('/')) return null;
                return path.join(OUTPUT, p);
              }

              if (!p || p.endsWith('/')) p = path.join(p, 'index.html');
              else if (!path.extname(p)) p = p + '/index.html';
              return path.join(OUTPUT, p);
            } catch {
              return null;
            }
          }

          function shouldSkip(url) {
            if (!url) return true;
            if (url.startsWith('blob:') || url.startsWith('data:')) return true;
            if (url.includes('cdn-cgi/')) return true;
            if (url.includes('challenge-platform')) return true;
            if (url.length > 240) return true;
            return false;
          }

          async function downloadAsset(assetUrl) {
            if (shouldSkip(assetUrl)) return;

            const clean = assetUrl.split('?')[0];
            if (downloaded.has(clean)) return;
            downloaded.add(clean);

            if (!clean.includes('payab.ir') &&
                !clean.includes('googleapis.com') &&
                !clean.includes('gstatic.com') &&
                !clean.includes('jsdelivr') &&
                !clean.includes('fontawesome') &&
                !clean.includes('bootstrapcdn')) {
              return;
            }

            const local = makeLocalPath(clean, true);
            if (!local || local.length > 240) return;

            ensureDir(path.dirname(local));
            if (fs.existsSync(local) && fs.statSync(local).size > 0) return;

            for (let i = 0; i < MAX_RETRIES; i++) {
              try {
                const proto = clean.startsWith('https') ? https : http;
                await new Promise((resolve, reject) => {
                  const req = proto.get(clean, { timeout: 18000 }, res => {
                    if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                      downloadAsset(res.headers.location).then(resolve).catch(reject);
                      return;
                    }
                    if (res.statusCode !== 200) {
                      reject(new Error('HTTP ' + res.statusCode));
                      return;
                    }
                    const file = fs.createWriteStream(local);
                    res.pipe(file);
                    file.on('finish', () => { file.close(); resolve(); });
                    file.on('error', reject);
                  });
                  req.on('error', reject);
                  req.on('timeout', () => { req.destroy(); reject(new Error('Timeout')); });
                });
                console.log('  ✓ ' + clean);
                await sleep(DELAY_BETWEEN_ASSETS);
                return;
              } catch (e) {
                if (i === MAX_RETRIES - 1) {
                  console.log('  ✗ ' + clean + ' → ' + e.message);
                  failed.push(clean);
                } else {
                  await sleep(1000 * (i + 1));
                }
              }
            }
          }

          (async () => {
            const critical = [
              'https://payab.ir/wp-content/plugins/elementor/assets/css/frontend.css',
              'https://payab.ir/wp-content/plugins/elementor/assets/css/frontend.min.css',
              'https://payab.ir/wp-includes/js/jquery/jquery.min.js'
            ];
            for (const a of critical) {
              await downloadAsset(a);
              await sleep(400);
            }

            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              viewport: { width: 1920, height: 1080 },
              locale: 'fa-IR'
            });

            context.on('response', async (res) => {
              try {
                const url = res.url();
                if (shouldSkip(url)) return;
                const ct = (res.headers()['content-type'] || '').toLowerCase();
                if (res.ok() && (
                  ct.includes('css') || ct.includes('javascript') || ct.includes('font') ||
                  ct.includes('image') ||
                  url.match(/\.(css|js|woff2?|ttf|eot|jpg|jpeg|png|gif|webp|svg|ico)(\?|$)/i)
                )) {
                  await downloadAsset(url);
                }
              } catch {}
            });

            for (const pageUrl of urls) {
              console.log('\n=== ' + pageUrl + ' ===');
              let success = false;

              for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
                try {
                  const page = await context.newPage();
                  await page.goto(pageUrl, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  await page.waitForTimeout(6000);
                  try { await page.waitForLoadState('networkidle', { timeout: 6000 }); } catch {}

                  await page.evaluate(async () => {
                    await new Promise(resolve => {
                      let total = 0;
                      const step = 700;
                      const timer = setInterval(() => {
                        window.scrollBy(0, step);
                        total += step;
                        if (total >= Math.max(document.body.scrollHeight, 2500)) {
                          clearInterval(timer);
                          window.scrollTo(0, 0);
                          resolve();
                        }
                      }, 130);
                    });
                  });
                  await page.waitForTimeout(2500);

                  let html = await page.content();
                  html = html
                    .replace(/https?:\/\/payab\.ir\//g, '/')
                    .replace(/https?:\/\/www\.payab\.ir\//g, '/');
                  html = html.replace(
                    /(\/(?:wp-content|wp-includes)\/[^"'?\s]+?\.(?:css|js|woff2?|ttf|eot|jpg|jpeg|png|gif|webp|svg|ico))\?[^"'>\s]*/gi, '$1'
                  );

                  const local = makeLocalPath(pageUrl, false);
                  if (!local || local.length > 240) {
                    console.log('  ⚠ Path too long');
                    await page.close();
                    break;
                  }

                  ensureDir(path.dirname(local));
                  fs.writeFileSync(local, html, 'utf8');
                  console.log('  ✓ Saved → ' + local);

                  await page.close();
                  success = true;
                  break;
                } catch (e) {
                  console.log('  ✗ Attempt ' + attempt + ': ' + e.message);
                  if (attempt < MAX_RETRIES) await sleep(3000 * attempt);
                }
              }
              if (!success) console.log('  !! Failed: ' + pageUrl);
              await sleep(DELAY_BETWEEN_PAGES);
            }

            await browser.close();
            console.log('Assets downloaded:', downloaded.size);
            fs.writeFileSync('failed-assets-' + CHUNK + '.txt', failed.join('\n'));
          })().catch(e => { console.error(e); process.exit(1); });
          ENDOFSCRIPT

      - name: Run scraper
        env:
          OUTPUT: ${{ env.OUTPUT }}
          CHUNK: ${{ matrix.chunk }}
          MAX_RETRIES: ${{ env.MAX_RETRIES }}
        run: node scrape.js

      - name: Debug
        run: |
          echo "HTML: $(find backup -name '*.html' | wc -l)"
          echo "CSS:  $(find backup -name '*.css' | wc -l)"
          echo "JS:   $(find backup -name '*.js' | wc -l)"
          find backup -name "*.html" | head -10

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: backup-chunk-${{ matrix.chunk }}
          path: backup/
          retention-days: 1
          if-no-files-found: warn

  merge:
    needs: download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts to temp
        uses: actions/download-artifact@v4
        with:
          pattern: backup-chunk-*
          merge-multiple: true
          path: tmp-artifacts

      - name: Flatten into backup (fix double nesting)
        run: |
          rm -rf backup
          mkdir -p backup

          echo "=== Content of tmp-artifacts ==="
          find tmp-artifacts -maxdepth 3 -type d | head -20

          if [ -d tmp-artifacts/backup/backup ]; then
            echo "Detected double nesting → flattening"
            cp -a tmp-artifacts/backup/backup/. backup/
          elif [ -d tmp-artifacts/backup ]; then
            echo "Single backup folder found"
            cp -a tmp-artifacts/backup/. backup/
          else
            echo "Files are at root of artifact"
            cp -a tmp-artifacts/. backup/
          fi

          if [ -d backup/backup ]; then
            echo "Still nested, fixing..."
            mv backup/backup/* backup/ 2>/dev/null || true
            mv backup/backup/.* backup/ 2>/dev/null || true
            rmdir backup/backup 2>/dev/null || rm -rf backup/backup
          fi

          echo "=== Final structure ==="
          find backup -maxdepth 2 -type d | head -25
          echo "HTML: $(find backup -name '*.html' | wc -l)"
          echo "CSS:  $(find backup -name '*.css' | wc -l)"

      - name: Fix links
        run: |
          find backup -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) -print0 |
          xargs -0 sed -i \
            -e 's#https\?://payab\.ir/#/#g' \
            -e 's#https\?://www\.payab\.ir/#/#g' || true

      - name: Verify
        run: |
          HTML=$(find backup -name "*.html" | wc -l)
          if [ "$HTML" -lt 1 ]; then
            echo "::error::No HTML files"
            exit 1
          fi
          echo "HTML files: $HTML"
          echo "✓ OK"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backup
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Static backup (fixed nesting) $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "✓ Pushed"
          fi
