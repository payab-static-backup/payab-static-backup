name: Build Static Backup
on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:
permissions:
  contents: write
env:
  SITE: https://payab.ir
  OUTPUT: backup
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack xmlstarlet tree
      - name: Read sitemaps
        id: split
        shell: bash
        run: |
          rm -f all-urls.txt
          echo "${SITE}/" > all-urls.txt

          echo "Reading page-sitemap.xml"
          curl -L -s "${SITE}/page-sitemap.xml" \
            | xmlstarlet sel \
                -N x="http://www.sitemaps.org/schemas/sitemap/0.9" \
                -t \
                -v "//x:loc" \
                -n \
            >> all-urls.txt || true

          # فایل‌های حیاتی CSS المنتور و پلاگین‌ها
          echo "https://payab.ir/wp-content/plugins/elementor/assets/css/frontend.min.css" >> all-urls.txt
          echo "https://payab.ir/wp-content/plugins/elementor/assets/css/frontend-rtl.min.css" >> all-urls.txt
          echo "https://payab.ir/wp-content/plugins/elementor/assets/css/frontend.css" >> all-urls.txt
          echo "https://payab.ir/wp-content/plugins/elementor/assets/css/frontend-rtl.css" >> all-urls.txt
          echo "https://payab.ir/wp-content/plugins/elementor/assets/css/widget-accordion-rtl.min.css" >> all-urls.txt
          echo "https://payab.ir/wp-content/plugins/elementor/assets/css/widget-icon-list-rtl.min.css" >> all-urls.txt
          echo "https://payab.ir/wp-content/plugins/elementor/assets/css/widget-image-rtl.min.css" >> all-urls.txt
          echo "https://payab.ir/wp-content/plugins/elementor/assets/css/widget-divider-rtl.min.css" >> all-urls.txt
          echo "https://payab.ir/wp-content/plugins/elementor/assets/css/widget-nav-menu-rtl.min.css" >> all-urls.txt
          echo "https://payab.ir/wp-content/plugins/elementor/assets/css/widget-heading-rtl.min.css" >> all-urls.txt
          echo "https://payab.ir/wp-content/plugins/elementor/assets/lib/swiper/v8/css/swiper.min.css" >> all-urls.txt
          echo "https://payab.ir/wp-content/plugins/elementor/assets/lib/swiper/css/swiper.min.css" >> all-urls.txt

          sort -u all-urls.txt -o all-urls.txt
          echo "========================="
          echo "Collected URLs"
          echo "========================="
          wc -l all-urls.txt
          cat all-urls.txt

          TOTAL=$(wc -l < all-urls.txt)
          if [ "$TOTAL" -le 10 ]; then
            cp all-urls.txt chunk-00.txt
            echo 'chunks=["0"]' >> "$GITHUB_OUTPUT"
          else
            split -n l/8 -d all-urls.txt chunk-
            for f in chunk-*; do
              mv "$f" "$f.txt"
            done
            echo 'chunks=["0","1","2","3","4","5","6","7"]' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload URL chunks
        uses: actions/upload-artifact@v4
        with:
          name: url-chunks
          path: chunk-*.txt

  download:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.chunks) }}
    steps:
      - name: Download chunk list
        uses: actions/download-artifact@v4
        with:
          name: url-chunks
      - name: Install HTTrack
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack tree
      - name: Download website
        shell: bash
        run: |
          mkdir -p "${OUTPUT}"
          URLFILE="chunk-0${{ matrix.chunk }}.txt"
          echo "Using: $URLFILE"
          cat "$URLFILE" || true

          while read -r URL; do
            [ -z "$URL" ] && continue
            echo "===================================="
            echo "Downloading: $URL"
            echo "===================================="
            httrack \
              "$URL" \
              -O "${OUTPUT}" \
              "+*.payab.ir/*" \
              "+*.payab.ir/wp-content/plugins/*" \
              "+*.payab.ir/wp-content/themes/*" \
              "+*.payab.ir/wp-content/uploads/*" \
              "-*wp-admin*" \
              "-*wp-login*" \
              "-*xmlrpc.php*" \
              "+*.css" \
              "+*.js" \
              "+*.jpg" \
              "+*.jpeg" \
              "+*.png" \
              "+*.webp" \
              "+*.svg" \
              "+*.gif" \
              "+*.ico" \
              "+*.woff" \
              "+*.woff2" \
              "+*.ttf" \
              "+*.eot" \
              "+*.json" \
              --robots=0 \
              --keep-links=0 \
              --near \
              --ext-depth=4 \
              --depth=4 \
              --sockets=6 \
              --connection-per-second=3 \
              --disable-security-limits \
              -v \
              || true
          done < "$URLFILE"
      - name: Debug downloaded files
        shell: bash
        run: |
          echo "==============================="
          echo "Tree"
          echo "==============================="
          tree -L 3 "${OUTPUT}" || true
          echo
          echo "HTML files:"
          find "${OUTPUT}" -name "*.html" || true
          echo
          echo "CSS files (first 40):"
          find "${OUTPUT}" -name "*.css" | head -40 || true
          echo
          echo "Counts → HTML: $(find "${OUTPUT}" -name "*.html" | wc -l) | CSS: $(find "${OUTPUT}" -name "*.css" | wc -l) | JS: $(find "${OUTPUT}" -name "*.js" | wc -l)"
      - name: Verify assets
        shell: bash
        run: |
          echo "Checking important CSS..."
          find "${OUTPUT}" -name "frontend*.css" || true
          find "${OUTPUT}" -name "widget-*.css" | head -10 || true
          find "${OUTPUT}" -name "swiper*.css" || true
      - name: Upload Chunk
        uses: actions/upload-artifact@v4
        with:
          name: backup-chunk-${{ matrix.chunk }}
          path: backup/

  merge:
    needs: download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare folders
        run: |
          rm -rf backup
          mkdir backup
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backup-chunk-*
          merge-multiple: true
          path: backup
      - name: Remove HTTrack Cache
        shell: bash
        run: |
          find backup -name "hts-cache*" -exec rm -rf {} + 2>/dev/null || true
          find backup -name "*.tmp" -delete 2>/dev/null || true
          find backup -name "*.lock" -delete 2>/dev/null || true
      - name: Fix absolute links (stronger)
        shell: bash
        run: |
          # اصلاح لینک‌ها در HTML و CSS و JS
          find backup -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) -print0 |
          xargs -0 sed -i \
            -e 's#https\?://payab\.ir/#/#g' \
            -e 's#https\?://www\.payab\.ir/#/#g' \
            -e 's#//payab\.ir/#/#g' || true
      - name: Show statistics
        shell: bash
        run: |
          echo "HTML: $(find backup -name "*.html" | wc -l)"
          echo "CSS:  $(find backup -name "*.css" | wc -l)"
          echo "JS:   $(find backup -name "*.js" | wc -l)"
          echo
          echo "Sample CSS files:"
          find backup -name "*.css" | head -30 || true
      - name: Verify downloaded website
        shell: bash
        run: |
          HTML_COUNT=$(find backup -name "*.html" | wc -l)
          CSS_COUNT=$(find backup -name "*.css" | wc -l)
          echo "HTML : $HTML_COUNT"
          echo "CSS  : $CSS_COUNT"
          if [ "$HTML_COUNT" -lt 1 ]; then
            echo "::error::No HTML files."
            exit 1
          fi
          if [ "$CSS_COUNT" -lt 5 ]; then
            echo "::warning::Very few CSS files ($CSS_COUNT)."
          fi
      - name: Check empty CSS
        shell: bash
        run: |
          EMPTY=$(find backup -name "*.css" -size 0)
          if [ -n "$EMPTY" ]; then
            echo "$EMPTY"
            echo "::warning::Empty CSS files found."
          else
            echo "No empty CSS files."
          fi
      - name: Final report
        shell: bash
        run: |
          echo "==============================="
          echo "FINAL REPORT"
          echo "==============================="
          echo "Directories: $(find backup -type d | wc -l)"
          echo "Files:       $(find backup -type f | wc -l)"
          echo "HTML:        $(find backup -name "*.html" | wc -l)"
          echo "CSS:         $(find backup -name "*.css" | wc -l)"
          echo "JS:          $(find backup -name "*.js" | wc -l)"
      - name: Commit backup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backup
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Static backup $(date -u '+%Y-%m-%d %H:%M UTC')"
      - name: Push repository
        run: git push
      - name: Finished
        run: echo "STATIC BACKUP COMPLETED"
