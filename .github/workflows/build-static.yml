name: Build Static Backup (TEST - Homepage Only)

on:
  workflow_dispatch: {}

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check if origin site is reachable
        id: check_site
        run: |
          if curl -sSf --max-time 20 -o /dev/null "https://payab.ir/"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::error::سایت اصلی در دسترس نیست"
            exit 1
          fi

      - name: Clean old backup
        run: rm -rf backup && mkdir -p backup

      - name: Download homepage + all assets
        run: |
          echo "https://payab.ir/" > urls.txt

          wget \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --wait=1 \
            --random-wait \
            --tries=3 \
            --dns-timeout=20 \
            --connect-timeout=20 \
            --read-timeout=40 \
            --reject-regex="-(300x[0-9]+|768x[0-9]+|1024x[0-9]+|1536x[0-9]+|2048x[0-9]+)\.(webp|jpg|jpeg|png)$" \
            --user-agent="Mozilla/5.0 (StaticBackupBot)" \
            --directory-prefix=backup \
            --input-file=urls.txt \
            || true

      - name: Clean zero-byte files
        run: |
          find backup -type f -size 0 -print -delete || true

      - name: Strip query strings from filenames and references
        run: |
          python3 << 'PYEOF'
          import os
          import re

          backup_dir = "backup"
          qs_pattern = re.compile(r'(\.(css|js))(\?|%3[Ff])[^"\'\s)>]*', re.IGNORECASE)

          # پاک کردن فایل‌های صفر بایتی
          for root, dirs, files in os.walk(backup_dir):
              for fname in files:
                  fpath = os.path.join(root, fname)
                  try:
                      if os.path.getsize(fpath) == 0:
                          os.remove(fpath)
                          print(f"Deleted empty: {fpath}")
                  except Exception:
                      pass

          # Rename فایل‌هایی که query string دارند
          renamed = 0
          for root, dirs, files in os.walk(backup_dir):
              for fname in files:
                  new_name = qs_pattern.sub(r'\1', fname)
                  if new_name != fname:
                      old_path = os.path.join(root, fname)
                      new_path = os.path.join(root, new_name)

                      if os.path.exists(new_path):
                          try:
                              if os.path.getsize(old_path) > os.path.getsize(new_path):
                                  os.remove(new_path)
                                  os.rename(old_path, new_path)
                                  renamed += 1
                              else:
                                  os.remove(old_path)
                          except Exception as e:
                              print(f"Conflict resolve error: {e}")
                      else:
                          os.rename(old_path, new_path)
                          renamed += 1

          print(f"Renamed {renamed} files")

          # اصلاح رفرنس‌ها داخل فایل‌های متنی
          text_exts = ('.html', '.css', '.js', '.json', '.xml', '.txt')
          fixed_refs = 0
          for root, dirs, files in os.walk(backup_dir):
              for fname in files:
                  if fname.lower().endswith(text_exts):
                      fpath = os.path.join(root, fname)
                      try:
                          with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          new_content = qs_pattern.sub(r'\1', content)
                          if new_content != content:
                              with open(fpath, 'w', encoding='utf-8') as f:
                                  f.write(new_content)
                              fixed_refs += 1
                      except Exception as e:
                          print(f"Warning: {fpath}: {e}")

          print(f"Fixed references in {fixed_refs} files")
          PYEOF

      - name: Sanitize remaining invalid filenames
        run: |
          find backup -depth -name '*[?:<>|*"]*' | while IFS= read -r f; do
            newname=$(echo "$f" | sed 's/[?:<>|*"]/_/g')
            if [ "$f" != "$newname" ]; then
              if [ -e "$newname" ]; then
                if [ $(stat -c%s "$f") -gt $(stat -c%s "$newname") ]; then
                  mv -f "$f" "$newname"
                else
                  rm -f "$f"
                fi
              else
                mv "$f" "$newname"
              fi
            fi
          done

      - name: Force internal links to root-relative
        run: |
          find backup -type f -name "*.html" -print0 | \
          xargs -0 sed -i -E 's#https?://(www\.)?payab\.ir/#/#g'

      - name: Final zero-byte cleanup
        run: |
          find backup -type f -size 0 -delete || true
          echo "===== Summary ====="
          echo "Total files: $(find backup -type f | wc -l)"
          echo "HTML files: $(find backup -name '*.html' | wc -l)"
          echo "CSS files: $(find backup -name '*.css' | wc -l)"
          echo "JS files: $(find backup -name '*.js' | wc -l)"
          ls -lh backup/ | head -20

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backup
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "TEST: homepage only static backup - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
