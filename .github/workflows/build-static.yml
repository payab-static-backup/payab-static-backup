name: Build Static Backup

on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE: https://payab.ir
  OUTPUT: backup
  MAX_RETRIES: 2

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Collect URLs (TEST MODE)
        id: split
        shell: bash
        run: |
          rm -f all-urls.txt
          echo "${SITE}/" > all-urls.txt

          # تست: page-sitemap + چند URL از ads برای بررسی حروف فارسی
          echo "Reading page-sitemap.xml ..."
          curl -L -s --retry 3 "${SITE}/page-sitemap.xml" \
            | xmlstarlet sel -N x="http://www.sitemaps.org/schemas/sitemap/0.9" -t -v "//x:loc" -n \
            >> all-urls.txt || true

          echo "Reading a few ads from ads-sitemap.xml (for Persian path test) ..."
          curl -L -s --retry 3 "${SITE}/ads-sitemap.xml" \
            | xmlstarlet sel -N x="http://www.sitemaps.org/schemas/sitemap/0.9" -t -v "//x:loc" -n \
            | head -15 \
            >> all-urls.txt || true

          grep -E '^https?://payab\.ir(/.*)?$' all-urls.txt \
            | grep -v -E '\.(jpg|jpeg|png|gif|webp|svg|css|js|woff|woff2|ttf|ico|pdf)(\?|$)' \
            | sort -u > clean-urls.txt
          mv clean-urls.txt all-urls.txt

          echo "TEST URLs ($(wc -l < all-urls.txt)):"
          cat all-urls.txt

          TOTAL=$(wc -l < all-urls.txt)
          if [ "$TOTAL" -le 3 ]; then
            cp all-urls.txt chunk-00.txt
            echo 'chunks=["0"]' >> "$GITHUB_OUTPUT"
          else
            split -n l/3 -d all-urls.txt chunk-
            for f in chunk-*; do mv "$f" "$f.txt"; done
            echo 'chunks=["0","1","2"]' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload chunks
        uses: actions/upload-artifact@v4
        with:
          name: url-chunks
          path: chunk-*.txt
          retention-days: 1

  download:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.chunks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download chunk list
        uses: actions/download-artifact@v4
        with:
          name: url-chunks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create scraper
        run: |
          cat > scrape.js << 'ENDOFSCRIPT'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const http = require('http');
          const { URL } = require('url');

          const OUTPUT = process.env.OUTPUT || 'backup';
          const CHUNK = process.env.CHUNK || '0';
          const MAX_RETRIES = parseInt(process.env.MAX_RETRIES || '2');
          const DELAY_BETWEEN_PAGES = 2500;
          const DELAY_BETWEEN_ASSETS = 300;

          const urlFile = `chunk-0${CHUNK}.txt`;
          const urls = fs.readFileSync(urlFile, 'utf8')
            .split('\n')
            .map(u => u.trim())
            .filter(u => u.startsWith('http'));

          console.log(`Chunk ${CHUNK}: ${urls.length} URLs`);

          const downloaded = new Set();
          const failed = [];

          function ensureDir(d) {
            fs.mkdirSync(d, { recursive: true });
          }

          function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
          }

          function toLocal(assetUrl) {
            try {
              const clean = assetUrl.split('?')[0];
              const u = new URL(clean);
              let p = decodeURIComponent(u.pathname);
              if (p.endsWith('/')) p += 'index.html';
              return path.join(OUTPUT, p.replace(/^\//, ''));
            } catch {
              return null;
            }
          }

          function shouldSkip(url) {
            if (!url) return true;
            if (url.startsWith('blob:') || url.startsWith('data:')) return true;
            if (url.includes('cdn-cgi/')) return true;
            if (url.includes('challenge-platform')) return true;
            if (url.length > 240) return true;
            return false;
          }

          async function downloadAsset(assetUrl) {
            if (shouldSkip(assetUrl)) return;

            const clean = assetUrl.split('?')[0];
            if (downloaded.has(clean)) return;
            downloaded.add(clean);

            const local = toLocal(clean);
            if (!local || local.length > 240) return;

            if (!clean.includes('payab.ir') &&
                !clean.includes('googleapis.com') &&
                !clean.includes('gstatic.com') &&
                !clean.includes('jsdelivr') &&
                !clean.includes('fontawesome') &&
                !clean.includes('bootstrapcdn')) {
              return;
            }

            ensureDir(path.dirname(local));
            if (fs.existsSync(local) && fs.statSync(local).size > 0) return;

            for (let i = 0; i < MAX_RETRIES; i++) {
              try {
                const proto = clean.startsWith('https') ? https : http;
                await new Promise((resolve, reject) => {
                  const req = proto.get(clean, { timeout: 15000 }, res => {
                    if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                      downloadAsset(res.headers.location).then(resolve).catch(reject);
                      return;
                    }
                    if (res.statusCode !== 200) {
                      reject(new Error('HTTP ' + res.statusCode));
                      return;
                    }
                    const file = fs.createWriteStream(local);
                    res.pipe(file);
                    file.on('finish', () => { file.close(); resolve(); });
                    file.on('error', reject);
                  });
                  req.on('error', reject);
                  req.on('timeout', () => { req.destroy(); reject(new Error('Timeout')); });
                });
                console.log('  ✓ ' + clean);
                await sleep(DELAY_BETWEEN_ASSETS);
                return;
              } catch (e) {
                if (i === MAX_RETRIES - 1) {
                  console.log('  ✗ ' + clean + ' → ' + e.message);
                  failed.push(clean);
                } else {
                  await sleep(800 * (i + 1));
                }
              }
            }
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              viewport: { width: 1920, height: 1080 },
              locale: 'fa-IR'
            });

            context.on('response', async (res) => {
              try {
                const url = res.url();
                if (shouldSkip(url)) return;
                const ct = (res.headers()['content-type'] || '').toLowerCase();
                if (res.ok() && (
                  ct.includes('css') || ct.includes('javascript') || ct.includes('font') ||
                  ct.includes('image') ||
                  url.match(/\.(css|js|woff2?|ttf|eot|jpg|jpeg|png|gif|webp|svg|ico)(\?|$)/i)
                )) {
                  await downloadAsset(url);
                }
              } catch {}
            });

            for (const pageUrl of urls) {
              console.log('\n=== ' + pageUrl + ' ===');
              let success = false;

              for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
                try {
                  const page = await context.newPage();
                  await page.goto(pageUrl, { waitUntil: 'domcontentloaded', timeout: 40000 });
                  await page.waitForTimeout(5000);

                  try { await page.waitForLoadState('networkidle', { timeout: 5000 }); } catch {}

                  await page.evaluate(async () => {
                    await new Promise(r => {
                      let t = 0;
                      const id = setInterval(() => {
                        window.scrollBy(0, 600);
                        t += 600;
                        if (t >= Math.max(document.body.scrollHeight, 2000)) {
                          clearInterval(id);
                          window.scrollTo(0, 0);
                          r();
                        }
                      }, 120);
                    });
                  });
                  await page.waitForTimeout(2000);

                  let html = await page.content();
                  html = html
                    .replace(/https?:\/\/payab\.ir\//g, '/')
                    .replace(/https?:\/\/www\.payab\.ir\//g, '/');
                  html = html.replace(
                    /(\/(?:wp-content|wp-includes)\/[^"'?\s]+?\.(?:css|js|woff2?|ttf|eot|jpg|jpeg|png|gif|webp|svg|ico))\?[^"'>\s]*/gi, '$1'
                  );

                  const u = new URL(pageUrl);
                  let pathname = decodeURIComponent(u.pathname);
                  let local = path.join(OUTPUT, pathname.replace(/^\//, ''));
                  if (local.endsWith('/') || !path.extname(local)) {
                    local = path.join(local, 'index.html');
                  } else if (!local.endsWith('.html')) {
                    local += '.html';
                  }

                  if (local.length > 240) {
                    console.log('  ⚠ path too long');
                    await page.close();
                    break;
                  }

                  ensureDir(path.dirname(local));
                  fs.writeFileSync(local, html, 'utf8');
                  console.log('  ✓ Saved → ' + local);

                  await page.close();
                  success = true;
                  break;
                } catch (e) {
                  console.log('  ✗ ' + e.message);
                  if (attempt < MAX_RETRIES) await sleep(2000 * attempt);
                }
              }
              if (!success) console.log('  !! Failed: ' + pageUrl);
              await sleep(DELAY_BETWEEN_PAGES);
            }

            await browser.close();
            console.log('Downloaded:', downloaded.size, '| Failed:', failed.length);
            fs.writeFileSync('failed-assets-' + CHUNK + '.txt', failed.join('\n'));
          })().catch(e => { console.error(e); process.exit(1); });
          ENDOFSCRIPT

      - name: Run scraper
        env:
          OUTPUT: ${{ env.OUTPUT }}
          CHUNK: ${{ matrix.chunk }}
          MAX_RETRIES: ${{ env.MAX_RETRIES }}
        run: node scrape.js

      - name: Debug
        run: |
          echo "=== HTML files ==="
          find backup -name "*.html" || true
          echo
          echo "=== Folders (should show Persian names if decode worked) ==="
          find backup -maxdepth 2 -type d || true
          echo
          echo "HTML: $(find backup -name '*.html' | wc -l) | CSS: $(find backup -name '*.css' | wc -l)"

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: backup-chunk-${{ matrix.chunk }}
          path: |
            backup/
            failed-assets-*.txt
          retention-days: 1
          if-no-files-found: warn

  merge:
    needs: download
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean old backup completely
        run: |
          # پاک‌سازی کامل برای حذف پوشه‌های encode‌شده قدیمی
          git rm -rf backup 2>/dev/null || true
          rm -rf backup
          mkdir -p backup

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backup-chunk-*
          merge-multiple: true
          path: .

      - name: Merge
        run: |
          find . -type d -name "backup" | while read d; do
            if [ "$d" != "./backup" ]; then
              cp -a "$d"/. backup/ 2>/dev/null || true
            fi
          done

      - name: Fix links
        run: |
          find backup -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) -print0 |
          xargs -0 sed -i -e 's#https\?://payab\.ir/#/#g' -e 's#https\?://www\.payab\.ir/#/#g' || true

      - name: Show result
        run: |
          echo "=== Final structure ==="
          find backup -maxdepth 2 -type d | head -30
          echo
          echo "HTML: $(find backup -name '*.html' | wc -l)"
          echo "CSS:  $(find backup -name '*.css' | wc -l)"

      - name: Commit (force clean)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A backup
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Static backup TEST (Persian decode + clean) $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "✓ Pushed"
          fi

      - name: Done
        run: echo "TEST COMPLETED"
