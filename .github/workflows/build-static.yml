name: Clean Backup Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove backup folder completely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -d backup ]; then
            echo "Removing backup folder..."
            git rm -rf backup
            git commit -m "Remove old nested backup folder completely"
            git push
            echo "✓ backup folder removed"
          else
            echo "No backup folder found"
          fi
