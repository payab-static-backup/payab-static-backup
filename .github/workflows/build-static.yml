name: Build Static Backup

on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clean old backup
        run: rm -rf backup && mkdir -p backup

      - name: Install xmlstarlet
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Extract URLs from sitemaps
        run: |
          SITEMAPS=(
            "https://payab.ir/ad_cat-sitemap.xml"
            "https://payab.ir/ads-sitemap.xml"
            "https://payab.ir/ads-sitemap2.xml"
            "https://payab.ir/building-news-sitemap.xml"
            "https://payab.ir/moghararat-sitemap.xml"
            "https://payab.ir/page-sitemap.xml"
            "https://payab.ir/post-sitemap.xml"
            "https://payab.ir/post_tag-sitemap.xml"
          )
          echo "https://payab.ir/" > sitemap-urls.txt
          for sm in "${SITEMAPS[@]}"; do
            curl -s --max-time 20 "$sm" | xmlstarlet sel -N x="http://www.sitemaps.org/schemas/sitemap/0.9" -t -v "//x:loc" -n >> sitemap-urls.txt || echo "Warning: failed to fetch $sm"
          done
          echo "Total URLs found: $(wc -l < sitemap-urls.txt)"

      - name: Check if origin site is reachable
        id: check_site
        run: |
          if curl -sSf --max-time 15 -o /dev/null "https://payab.ir/"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::سایت اصلی در دسترس نیست — بک‌آپ قبلی دست‌نخورده باقی می‌ماند."
          fi

      - name: Download all pages from sitemap list
        if: steps.check_site.outputs.reachable == 'true'
        continue-on-error: true
        run: |
          wget \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --no-parent \
            --wait=1 \
            --random-wait \
            --tries=3 \
            --timeout=30 \
            --user-agent="Mozilla/5.0 (StaticBackupBot)" \
            --directory-prefix=backup \
            --input-file=sitemap-urls.txt || true

      - name: Verify backup integrity
        id: verify
        if: steps.check_site.outputs.reachable == 'true'
        run: |
          chmod +x scripts/verify.sh
          if bash scripts/verify.sh; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::بررسی سلامت بک‌آپ شکست خورد — این نسخه commit نمی‌شود."
          fi

      - name: Commit and push changes
        if: steps.check_site.outputs.reachable == 'true' && steps.verify.outputs.passed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backup
          git diff --quiet && git diff --staged --quiet || git commit -m "Static backup update - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
