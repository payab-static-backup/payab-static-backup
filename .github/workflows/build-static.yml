name: Build Static Backup

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE: https://payab.ir
  OUTPUT: backup
  MAX_RETRIES: 2

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Collect test URLs
        id: split
        shell: bash
        run: |
          rm -f all-urls.txt
          echo "${SITE}/" > all-urls.txt

          curl -L -s --retry 3 "${SITE}/page-sitemap.xml" \
            | xmlstarlet sel -N x="http://www.sitemaps.org/schemas/sitemap/0.9" -t -v "//x:loc" -n \
            >> all-urls.txt || true

          # ۱۰ آگهی برای تست حروف فارسی
          curl -L -s --retry 3 "${SITE}/ads-sitemap.xml" \
            | xmlstarlet sel -N x="http://www.sitemaps.org/schemas/sitemap/0.9" -t -v "//x:loc" -n \
            | head -10 \
            >> all-urls.txt || true

          grep -E '^https?://payab\.ir(/.*)?$' all-urls.txt \
            | grep -v -E '\.(jpg|jpeg|png|gif|webp|svg|css|js|woff|woff2|ttf|ico|pdf)(\?|$)' \
            | sort -u > clean-urls.txt
          mv clean-urls.txt all-urls.txt

          echo "Test URLs:"
          cat all-urls.txt
          echo "Total: $(wc -l < all-urls.txt)"

          cp all-urls.txt chunk-00.txt
          echo 'chunks=["0"]' >> "$GITHUB_OUTPUT"

      - name: Upload chunks
        uses: actions/upload-artifact@v4
        with:
          name: url-chunks
          path: chunk-*.txt

  download:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: url-chunks

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create scraper
        run: |
          cat > scrape.js << 'ENDOFSCRIPT'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const http = require('http');
          const { URL } = require('url');

          const OUTPUT = 'backup';
          const CHUNK = process.env.CHUNK || '0';
          const MAX_RETRIES = 2;
          const DELAY_BETWEEN_PAGES = 2500;

          const urls = fs.readFileSync(`chunk-0${CHUNK}.txt`, 'utf8')
            .split('\n').map(u => u.trim()).filter(u => u.startsWith('http'));

          console.log('URLs:', urls.length);

          const downloaded = new Set();

          function ensureDir(d) { fs.mkdirSync(d, { recursive: true }); }
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function makeLocalPath(inputUrl) {
            try {
              const u = new URL(inputUrl.split('?')[0]);
              let p = u.pathname;
              try { p = decodeURIComponent(p); } catch {}
              p = p.replace(/^\//, '');
              if (!p || p.endsWith('/')) p = path.join(p, 'index.html');
              else if (!path.extname(p)) p = p + '/index.html';
              return path.join(OUTPUT, p);
            } catch {
              return null;
            }
          }

          function shouldSkip(url) {
            if (!url) return true;
            if (url.startsWith('blob:') || url.startsWith('data:')) return true;
            if (url.includes('cdn-cgi/')) return true;
            if (url.includes('challenge-platform')) return true;
            if (url.length > 240) return true;
            return false;
          }

          async function downloadAsset(assetUrl) {
            if (shouldSkip(assetUrl)) return;

            const clean = assetUrl.split('?')[0];
            if (downloaded.has(clean)) return;
            downloaded.add(clean);

            if (!clean.includes('payab.ir') &&
                !clean.includes('googleapis.com') &&
                !clean.includes('gstatic.com') &&
                !clean.includes('jsdelivr') &&
                !clean.includes('fontawesome') &&
                !clean.includes('bootstrapcdn')) {
              return;
            }

            const local = makeLocalPath(clean);
            if (!local || local.length > 240) return;

            // برای assetها پسوند را حفظ کن (نه index.html)
            let finalPath = local;
            if (finalPath.endsWith('/index.html')) {
              finalPath = finalPath.replace(/\/index\.html$/, '');
            }

            ensureDir(path.dirname(finalPath));
            if (fs.existsSync(finalPath) && fs.statSync(finalPath).size > 0) return;

            for (let i = 0; i < MAX_RETRIES; i++) {
              try {
                const proto = clean.startsWith('https') ? https : http;
                await new Promise((resolve, reject) => {
                  const req = proto.get(clean, { timeout: 15000 }, res => {
                    if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                      downloadAsset(res.headers.location).then(resolve).catch(reject);
                      return;
                    }
                    if (res.statusCode !== 200) {
                      reject(new Error('HTTP ' + res.statusCode));
                      return;
                    }
                    const file = fs.createWriteStream(finalPath);
                    res.pipe(file);
                    file.on('finish', () => { file.close(); resolve(); });
                    file.on('error', reject);
                  });
                  req.on('error', reject);
                  req.on('timeout', () => { req.destroy(); reject(new Error('Timeout')); });
                });
                console.log('  ✓ Asset:', clean);
                return;
              } catch (e) {
                if (i === MAX_RETRIES - 1) {
                  console.log('  ✗ Asset:', clean, '→', e.message);
                } else {
                  await sleep(800 * (i + 1));
                }
              }
            }
          }

          (async () => {
            // فایل‌های حیاتی
            const critical = [
              'https://payab.ir/wp-content/plugins/elementor/assets/css/frontend.css',
              'https://payab.ir/wp-content/plugins/elementor/assets/css/frontend.min.css',
              'https://payab.ir/wp-includes/js/jquery/jquery.min.js'
            ];
            for (const a of critical) {
              await downloadAsset(a);
              await sleep(300);
            }

            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox']
            });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              locale: 'fa-IR',
              viewport: { width: 1920, height: 1080 }
            });

            // جمع‌آوری CSS و JS از شبکه
            context.on('response', async (res) => {
              try {
                const url = res.url();
                if (shouldSkip(url)) return;
                const ct = (res.headers()['content-type'] || '').toLowerCase();
                if (res.ok() && (
                  ct.includes('css') || ct.includes('javascript') || ct.includes('font') ||
                  ct.includes('image') ||
                  url.match(/\.(css|js|woff2?|ttf|eot|jpg|jpeg|png|gif|webp|svg|ico)(\?|$)/i)
                )) {
                  await downloadAsset(url);
                }
              } catch {}
            });

            for (const pageUrl of urls) {
              console.log('\n===', pageUrl);
              try {
                const page = await context.newPage();
                await page.goto(pageUrl, { waitUntil: 'domcontentloaded', timeout: 40000 });
                await page.waitForTimeout(6000);

                try { await page.waitForLoadState('networkidle', { timeout: 5000 }); } catch {}

                // اسکرول برای لود lazy
                await page.evaluate(async () => {
                  await new Promise(r => {
                    let t = 0;
                    const id = setInterval(() => {
                      window.scrollBy(0, 600);
                      t += 600;
                      if (t >= Math.max(document.body.scrollHeight, 2000)) {
                        clearInterval(id);
                        window.scrollTo(0, 0);
                        r();
                      }
                    }, 120);
                  });
                });
                await page.waitForTimeout(2000);

                let html = await page.content();
                html = html
                  .replace(/https?:\/\/payab\.ir\//g, '/')
                  .replace(/https?:\/\/www\.payab\.ir\//g, '/');

                // حذف query string از لینک‌های استاتیک
                html = html.replace(
                  /(\/(?:wp-content|wp-includes)\/[^"'?\s]+?\.(?:css|js|woff2?|ttf|eot|jpg|jpeg|png|gif|webp|svg|ico))\?[^"'>\s]*/gi,
                  '$1'
                );

                const local = makeLocalPath(pageUrl);
                console.log('  Saving HTML →', local);
                ensureDir(path.dirname(local));
                fs.writeFileSync(local, html, 'utf8');
                console.log('  ✓ HTML saved');

                await page.close();
              } catch (e) {
                console.log('  ✗', e.message);
              }
              await sleep(DELAY_BETWEEN_PAGES);
            }

            await browser.close();
            console.log('Total assets downloaded:', downloaded.size);
          })().catch(e => { console.error(e); process.exit(1); });
          ENDOFSCRIPT

      - name: Run scraper
        env:
          CHUNK: ${{ matrix.chunk }}
        run: node scrape.js

      - name: Debug
        run: |
          echo "=== Structure ==="
          find backup -type d | head -30
          echo
          echo "HTML: $(find backup -name '*.html' | wc -l)"
          echo "CSS:  $(find backup -name '*.css' | wc -l)"
          echo "JS:   $(find backup -name '*.js' | wc -l)"
          echo
          echo "Sample CSS:"
          find backup -name "*.css" | head -10

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: backup-chunk-${{ matrix.chunk }}
          path: backup/

  merge:
    needs: download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          rm -rf backup
          mkdir -p backup

      - name: Download artifacts into backup
        uses: actions/download-artifact@v4
        with:
          pattern: backup-chunk-*
          merge-multiple: true
          path: backup

      - name: Show result
        run: |
          echo "HTML: $(find backup -name '*.html' | wc -l)"
          echo "CSS:  $(find backup -name '*.css' | wc -l)"
          echo "JS:   $(find backup -name '*.js' | wc -l)"
          echo
          find backup -name "*.css" | head -15

      - name: Fix links
        run: |
          find backup -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) -print0 |
          xargs -0 sed -i \
            -e 's#https\?://payab\.ir/#/#g' \
            -e 's#https\?://www\.payab\.ir/#/#g' || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backup
          git status
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Test backup with Persian paths + CSS/JS $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "✓ Pushed"
          fi
