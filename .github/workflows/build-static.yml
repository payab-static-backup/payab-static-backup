name: Test Static Backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xmlstarlet
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet

      - name: Clean backup
        run: |
          rm -rf backup
          mkdir -p backup

      - name: Download sitemap URLs
        run: |
          curl -fsSL https://payab.ir/page-sitemap.xml \
            | xmlstarlet sel \
                -N x="http://www.sitemaps.org/schemas/sitemap/0.9" \
                -t -m "//x:loc" -v . -n \
            > urls.txt

          echo "https://payab.ir/" >> urls.txt

          sort -u urls.txt -o urls.txt

          echo "URLs:"
          cat urls.txt

      - name: Download pages
        run: |
          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --span-hosts \
            --no-parent \
            --execute robots=off \
            --user-agent="Mozilla/5.0" \
            --directory-prefix=backup \
            --input-file=urls.txt || true

      - name: Show backup
        run: |
          echo "==== BACKUP ===="
          find backup | head -300

      - name: Remove wget cache
        run: |
          find backup -name "*.orig" -delete
          find backup -name "*.tmp" -delete

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add backup

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Test static backup"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin HEAD
