- name: Download this chunk
  if: steps.check_site.outputs.reachable == 'true'
  run: |
    mkdir -p backup

    wget \
      --mirror \
      --page-requisites \
      --convert-links \
      --adjust-extension \
      --execute robots=off \
      --no-parent \
      --wait=1 \
      --random-wait \
      --tries=3 \
      --dns-timeout=20 \
      --connect-timeout=20 \
      --read-timeout=30 \
      --user-agent="Mozilla/5.0 (StaticBackupBot)" \
      --directory-prefix=backup \
      --input-file=url-chunk-0${{ matrix.chunk }}.txt

- name: Debug downloaded files
  if: steps.check_site.outputs.reachable == 'true'
  run: |
    echo "========== wp-content =========="
    find backup -type d -path "*wp-content*" | sort

    echo
    echo "========== plugins =========="
    find backup -type d -path "*wp-content/plugins*" | sort

    echo
    echo "========== elementor =========="
    find backup -path "*elementor*" | head -100

    echo
    echo "========== frontend.min.css =========="
    find backup -name "frontend.min.css"

    echo
    echo "========== frontend-rtl.min.css =========="
    find backup -name "frontend-rtl.min.css"

    echo
    echo "========== CSS count =========="
    find backup -name "*.css" | wc -l

- name: Verify Elementor assets
  if: steps.check_site.outputs.reachable == 'true'
  run: |
    if [ ! -f backup/payab.ir/wp-content/plugins/elementor/assets/css/frontend.min.css ]; then
      echo "::error::Elementor frontend.min.css was NOT downloaded"
      exit 1
    fi

    if [ ! -f backup/payab.ir/wp-content/plugins/elementor/assets/css/frontend-rtl.min.css ]; then
      echo "::warning::frontend-rtl.min.css not found"
    fi
